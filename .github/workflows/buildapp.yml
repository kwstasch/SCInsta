# Inspired heavily by the following workflows
# https://github.com/arichornlover/uYouEnhanced/blob/main/.github/workflows/buildapp.yml
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml
# https://github.com/BandarHL/BHTwitter/actions/workflows/build.yml

name: Build and Package SCInsta

on:
    workflow_dispatch:
        inputs:
            decrypted_instagram_url:
                description: "The direct URL to the decrypted Instagram IPA"
                default: ""
                required: true
                type: string
            upload_artifact:
                description: "Upload Artifact"
                default: true
                required: false
                type: boolean
  
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Build SCInsta
        runs-on: macos-latest
        permissions:
            contents: write

        steps:
            - name: Checkout Main
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Install Dependencies
              run: brew install ldid dpkg make

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH 

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            # theos/logos master (777925d, theos/logos#114) rewrote %orig handling: it now
            # replaces everything from %orig to end-of-line and re-appends only ";", so any
            # %orig that is not alone on its line -- VOID_HANDLESCREENSHOT(%orig),
            # [SCIUtils liquidGlassEnabledBool:%orig], removeItemsInList(%orig, YES) -- loses
            # its closing bracket and the generated code no longer compiles. a623700 is the
            # commit directly before that change; drop this step once #114 is fixed upstream.
            - name: Pin Logos to known-good version
              run: |
                cd "$THEOS/vendor/logos"
                git fetch --depth=1 origin a62370066a97e36d59b200a9fa10c5091f5e8972
                git checkout a62370066a97e36d59b200a9fa10c5091f5e8972
              env:
                THEOS: ${{ github.workspace }}/theos
        
            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Prepare Instagram IPA
              run: |
                cd main

                mkdir -p packages
                IPA="packages/com.burbn.instagram.ipa"

                # GitHub's /releases/download proxy sometimes answers 504 instead of
                # redirecting to object storage. Retry, then fall back to the API
                # (gh), which resolves the asset through a different path.
                if ! wget "$Instagram_URL" --no-verbose --tries=3 --waitretry=15 --timeout=120 -O "$IPA"; then
                  echo "::warning::direct download failed, falling back to gh release download"
                  NAME="${Instagram_URL##*/}"
                  TAG="${Instagram_URL%"/$NAME"}"
                  TAG="${TAG##*/}"
                  gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir packages --clobber
                  mv "packages/$NAME" "$IPA"
                fi

                # Fail early if we got an HTML error page instead of the IPA
                if [ "$(xxd -p -l 2 "$IPA")" != "504b" ]; then
                  echo "::error::downloaded file is not a zip/IPA"
                  head -c 300 "$IPA" || true
                  exit 1
                fi

                ls -la packages
                
              env:
                THEOS: ${{ github.workspace }}/theos
                Instagram_URL: ${{ inputs.decrypted_instagram_url }}
                GH_TOKEN: ${{ github.token }}

            - name: Get SCInsta Version
              id: scinsta_version
              run: |
                SCINSTA_VERSION=$(awk '/Version:/ {print $2}' main/control)

                echo "SCINSTA_VERSION=${SCINSTA_VERSION}" >> "$GITHUB_ENV"
                echo "version=${SCINSTA_VERSION}" >> "$GITHUB_OUTPUT"
            
            - name: Build SCInsta tweak for sideloading (as IPA)
              run: |
                pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
                
                cd main
                if ! curl -Lo ipapatch --fail --retry 5 --retry-delay 5 --retry-all-errors \
                    https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.macos-arm64; then
                  echo "::warning::direct download failed, falling back to gh release download"
                  gh release download v2.1.3 --repo asdfzxcvbn/ipapatch --pattern ipapatch.macos-arm64 --clobber
                  # gh writes the asset name, not the local name
                  mv ipapatch.macos-arm64 ipapatch
                fi
                if ! file ipapatch 2>/dev/null | grep -q 'Mach-O'; then
                  echo "::error::ipapatch is not a Mach-O binary (GitHub served an error page)"
                  head -c 200 ipapatch 2>/dev/null || true
                  exit 1
                fi
                chmod +x ipapatch
                export PATH=.:$PATH
                ls -la

                ./build.sh sideload
                ls -la packages
                
              env:
                THEOS: ${{ github.workspace }}/theos
                GH_TOKEN: ${{ github.token }}

            - name: Rename IPA to include version info
              run: |
                cd main/packages
                mv "$(ls -t | head -n1)" "SCInsta_sideloaded_v${SCINSTA_VERSION}.ipa"

            - name: Pass package name to upload action
              id: package_name
              run: |
                echo "package=$(ls -t main/packages |  head -n1)" >> "$GITHUB_OUTPUT"

            - name: Upload Artifact
              if: ${{ inputs.upload_artifact }}
              uses: actions/upload-artifact@v4
              with:
                name: SCInsta_sideloaded_v${{ steps.scinsta_version.outputs.version }}
                path: ${{ github.workspace }}/main/packages/${{ steps.package_name.outputs.package }}
                if-no-files-found: error

            - name: Create Release
              uses: softprops/action-gh-release@v2.0.6
              with:
                name: SCInsta_sideloaded_v${{ steps.scinsta_version.outputs.version }}
                files: ${{ github.workspace }}/main/packages/SCInsta_sideloaded_v*.ipa
                draft: true

            - name: Output Release URL
              run: |
                echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
